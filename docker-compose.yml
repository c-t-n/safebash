version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: safebash-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=safebash
    networks:
      - safebash-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/safebash --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: safebash-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - safebash-network
    # Some Docker runtimes (e.g. OrbStack) inject HTTP_PROXY into every
    # container; that proxy can't reach the Ollama model registry. Empty
    # these out so model pulls go direct.
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot init service: pulls the model picked by $OLLAMA_MODEL the
  # first time the stack boots, then exits. Backend depends on this
  # completing so the explainer has a working model on first request.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: safebash-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$OLLAMA_MODEL"']
    networks:
      - safebash-network
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: safebash-backend
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/.env:/app/apps/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/safebash
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    networks:
      - safebash-network
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    command: pnpm --filter @safebash/backend run dev

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: safebash-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
    environment:
      - VITE_API_URL=http://backend:3001/api
      - BACKEND_URL=http://backend:3001
    networks:
      - safebash-network
    depends_on:
      - backend
    command: pnpm --filter @safebash/frontend exec vite --host 0.0.0.0

networks:
  safebash-network:
    driver: bridge

volumes:
  mongodb_data:
  ollama_models:
