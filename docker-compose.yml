version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: safebash-backend
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/.env:/app/apps/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - safebash-network
    command: npm run backend:dev

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: safebash-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
    environment:
      - VITE_API_URL=http://localhost:3001/api
    networks:
      - safebash-network
    depends_on:
      - backend
    command: npm run frontend:dev -- --host

networks:
  safebash-network:
    driver: bridge
