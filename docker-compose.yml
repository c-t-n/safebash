version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: safebash-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=safebash
    networks:
      - safebash-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/safebash --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: safebash-backend
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/.env:/app/apps/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/safebash
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
    networks:
      - safebash-network
    depends_on:
      mongodb:
        condition: service_healthy
    command: pnpm --filter @safebash/backend run dev

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: safebash-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
    environment:
      - VITE_API_URL=http://backend:3001/api
      - BACKEND_URL=http://backend:3001
    networks:
      - safebash-network
    depends_on:
      - backend
    command: pnpm --filter @safebash/frontend exec vite --host 0.0.0.0

networks:
  safebash-network:
    driver: bridge

volumes:
  mongodb_data:
